[build]
  publish = "app/static"

# If hosting frontend on Netlify while running Python backend on Render/Railway:
# Replace the URL below with your backend URL (e.g. https://twodo.onrender.com)
[[redirects]]
  from = "/api/*"
  to = "https://YOUR-BACKEND-URL.onrender.com/api/:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
